---
# Causa Backend — OpenShift Route
# Namespace placeholder: PLACEHOLDER_NAMESPACE  (replaced by installer at apply time)
#
# Exposes the Causa Backend HTTP API externally via the OpenShift ingress router.
# TLS is terminated at the router (edge termination) — traffic inside the cluster
# is plain HTTP on port 8080.
#
# Access after install:
#   https://<host>/api/v1/diagnostics
#   (host is assigned by the cluster ingress controller)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: causa-backend
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: causa-backend
    app.kubernetes.io/name: causa-backend
    app.kubernetes.io/component: rca-engine
spec:
  to:
    kind: Service
    name: causa-backend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
