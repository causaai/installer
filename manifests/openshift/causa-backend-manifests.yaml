---
# Causa Backend — OpenShift manifests
# Namespace placeholder: PLACEHOLDER_NAMESPACE  (replaced by installer at apply time)
#
# This file is applied on OpenShift only. The kind target uses manifests/causa/deployment.yaml.
# It combines what the mvp_demo installer keeps in base/ and overlays/openshift/:
#   - ConfigMap (causa-config) with all public configuration
#   - ServiceAccount
#   - Deployment with OpenShift security context and management port
#   - ClusterIP Service (no NodePort; access via Route)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: causa-backend
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: causa-backend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: causa-config
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app.kubernetes.io/name: causa-backend
data:
  # Application Configuration
  CAUSA_LOG_LEVEL: "INFO"
  # Environment marker
  CLUSTER_TYPE: "openshift"

  # Database Configuration
  CAUSA_DB_URL: "jdbc:postgresql://iri-db-rw.PLACEHOLDER_NAMESPACE.svc.cluster.local:5432/iri-db"

  # LLM Configuration (Public settings - non-sensitive)
  # Provider: anthropic (direct API) | vertex-ai-anthropic (Google Cloud) | bob (BOB Shell CLI) | ibm-bob (future REST API) | ollama (future)
  # DO NOT set required string properties to ""
  # LLM_PROVIDER: ""
  # LLM_MODEL_NAME: ""

  # Vertex AI Configuration (Public settings)
  # Valid regions: us-east5, us-central1, europe-west1, asia-southeast1
  # Note: 'global' is NOT valid for Claude on Vertex AI
  # VERTEX_LOCATION: ""

  # Optional overrides (leave empty to use defaults)
  # LLM_BASE_URL: ""
  # LLM_AUTH_TYPE: ""
  # LLM_CUSTOM_HEADERS: ""

  LLM_TEMPERATURE: "0.1"
  LLM_MAX_TOKENS: "8192"
  # Set to "true" to enable skills globally
  LLM_SKILLS_ENABLED: "false"
  # BOB Shell requires longer execution time — set to 180s (3 min) for long-running analysis
  LLM_TIMEOUT_SECONDS: "180"
  LLM_CHAT_MEMORY_SIZE: "25"

  # Alert Configuration
  # Minimum alert severity to trigger diagnostic pipeline (critical, warning, info)
  CAUSA_ALERT_SEVERITY: "critical"

  # Time to wait (minutes) before analyzing repeat alerts for same pod to prevent LLM spam
  CAUSA_ALERT_COOLDOWN: "15"

  # Comma-separated list of namespaces to ignore (e.g., system namespaces)
  CAUSA_ALERT_IGNORE_NS: "kube-system,istio-system"

  # MCP Kubernetes Configuration
  CAUSA_MCP_K8S_ENDPOINT: "http://kubernetes-mcp-server:8080"
  CAUSA_MCP_K8S_HEALTH_PATH: "/healthz"
  CAUSA_MCP_K8S_TIMEOUT: "5000"

  # MCP Kruize Configuration (Resource Optimization Recommendations)
  CAUSA_MCP_KRUIZE_ENDPOINT: "http://kruize-mcp-server-service:8080"
  CAUSA_MCP_KRUIZE_HEALTH_PATH: "/q/health/ready"
  CAUSA_MCP_KRUIZE_TIMEOUT: "10000"

  # MCP Cryostat Configuration (JFR-based Java Runtime Analysis)
  CAUSA_MCP_CRYOSTAT_ENDPOINT: "http://cryostat-mcp:8000"
  CAUSA_MCP_CRYOSTAT_HEALTH_ENDPOINT: "http://cryostat-mcp-api:8080"
  CAUSA_MCP_CRYOSTAT_HEALTH_PATH: "/healthz"
  CAUSA_MCP_CRYOSTAT_TIMEOUT: "15000"
  CAUSA_MCP_CRYOSTAT_RETRY_DELAY: "5000"
  CAUSA_MCP_CRYOSTAT_MAX_RETRIES: "3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: causa-backend
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: causa-backend
    app.kubernetes.io/name: causa-backend
    app.kubernetes.io/component: rca-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: causa-backend
  template:
    metadata:
      labels:
        app: causa-backend
        app.kubernetes.io/name: causa-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/q/metrics"
    spec:
      serviceAccountName: causa-backend
      # OpenShift security context
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: causa-backend
          # Image resolved from CAUSA_BACKEND_IMAGE / lib/images.env
          image: quay.io/causaai/causa-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          env:
            # namespace — used to construct FQDN for k8s svc URLs
            - name: APP_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            # Public configuration — all keys from ConfigMap as env vars
            - configMapRef:
                name: causa-config
            # LLM API keys / credentials (optional)
            - secretRef:
                name: causa-llm-secrets
                optional: true
            # Database credentials
            - secretRef:
                name: causa-db-secrets
                optional: false
          # OpenShift container security context
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: causa-backend
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: causa-backend
    app.kubernetes.io/name: causa-backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: management
      port: 9000
      targetPort: management
      protocol: TCP
  selector:
    app.kubernetes.io/name: causa-backend
