---
# Quarkus MCP Server — OpenShift Route
# Namespace placeholder: PLACEHOLDER_NAMESPACE  (replaced by installer at apply time)
#
# Exposes the Quarkus MCP Server externally via the OpenShift ingress router.
# TLS is terminated at the router (edge termination).
#
# Access after install:
#   https://<host>/mcp
#   (host is assigned by the cluster ingress controller)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: quarkus-mcp
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: mcp-metrics
spec:
  to:
    kind: Service
    name: mcp-metrics
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
