# Kubernetes Secret wrapping the Alertmanager configuration for Causa RCA.
#
# Placeholders (replaced by installer at apply time):
#   PLACEHOLDER_NAMESPACE   — target namespace (UWM or platform monitoring)
#   PLACEHOLDER_WEBHOOK_URL — Causa Backend webhook endpoint
#
# Usage:
#   Topology A (UWM Alertmanager present):
#     Applied as-is to openshift-user-workload-monitoring via apply_manifest.
#     The UWM Alertmanager starts with no custom config, so this Secret owns
#     it entirely.
#
#   Topology B (platform Alertmanager only):
#     The Critical receiver and causa-* child route are extracted from the
#     stringData block below and merged INTO the existing alertmanager-main
#     Secret in openshift-monitoring, preserving all pre-existing routes and
#     receivers.  The merge is performed by _ocp_configure_platform_alertmanager
#     in enable_monitoring.sh.
#
# Note: this file is NOT applied on Kind.  On Kind, Alertmanager is installed
# fresh via Helm (kube-prometheus-stack) and its config is supplied through
# Helm values in _write_alertmanager_values (install_prometheus.sh).
apiVersion: v1
kind: Secret
metadata:
  name: PLACEHOLDER_ALERTMANAGER_SECRET_NAME
  namespace: PLACEHOLDER_NAMESPACE
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      http_config:
        proxy_from_environment: true
      resolve_timeout: 5m

    inhibit_rules:
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = "critical"
      target_matchers:
      - severity =~ "warning|info"
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = "warning"
      target_matchers:
      - severity = "info"

    receivers:
    - name: Default
    - name: Watchdog
    - name: causa-critical
      webhook_configs:
      - url: 'PLACEHOLDER_WEBHOOK_URL'
        send_resolved: false
        http_config:
          follow_redirects: true

    route:
      group_by:
      - namespace
      group_interval: 5m
      group_wait: 30s
      receiver: Default
      repeat_interval: 12h
      routes:
      - matchers:
        - alertname = "Watchdog"
        receiver: Watchdog
      - matchers:
        - alertname =~ "causa-.*"
        receiver: causa-critical
        group_wait: 5s
        group_interval: 5s
        repeat_interval: 15m
      - matchers:
        - severity = "critical"
        receiver: causa-critical
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 15m
