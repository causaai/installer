# NetworkPolicy — allow ingress to the Causa Backend pod on port 8080 from:
#   1. Alertmanager (kube-prometheus-stack) in the monitoring namespace
#   2. causa-mcp in the same namespace — it calls the backend REST API at startup
#      and on every tool invocation; without this rule its traffic is silently
#      dropped on clusters with a default-deny ingress NetworkPolicy.
#   3. OpenShift ingress router (openshift-ingress namespace) — required so the
#      HAProxy router can proxy external HTTPS traffic to the backend pod.
#      Without this rule the router times out and returns HTTP 503.
#
# Namespace placeholder: PLACEHOLDER_NAMESPACE  (replaced by installer at apply time)
#
# On OpenShift with User Workload Monitoring, also allow from
# openshift-user-workload-monitoring — add that namespaceSelector if needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-to-causa-backend
  namespace: PLACEHOLDER_NAMESPACE
spec:
  podSelector:
    matchLabels:
      app: causa-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app: causa-mcp
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - protocol: TCP
          port: 8080
