# PrometheusRule for workloads managed by Causa RCA.
#
# Placeholders (replaced by installer at apply time):
#   PLACEHOLDER_RULE_NAMESPACE — namespace where the rule is deployed
#       Kind:      install namespace (picked up by kube-prometheus-stack)
#       OpenShift: openshift-monitoring (picked up by platform prometheus-k8s,
#                  the only Prometheus that has container_* and kube_* metrics)
#
# Opt-in: only pods carrying the label  causa.ai/monitoring: "true"  are monitored.
# Add this label to any workload you want Causa RCA to analyse:
#   kubectl label pod <pod> causa.ai/monitoring=true
#   # or set it in your Deployment's pod template metadata.labels
#
# When any alert fires, Alertmanager POSTs the full payload to:
#   http://causa-backend.<namespace>.svc.cluster.local:8080/api/v1/webhooks/alerts
# which triggers Causa Backend to start an RCA for the affected workload.
#
# The backend cooldown is 15 minutes — repeat_interval in the Alertmanager config
# is set to 15m accordingly so the same firing alert is not re-sent before
# a previous RCA has had time to complete.
#
# Required: Prometheus Operator must be installed (kube-prometheus-stack on Kind,
# built-in User Workload Monitoring on OpenShift).
#
# Annotation keys consumed by Causa Backend's alert handler:
#   annotations.workload_name  — identifies the workload in the diagnostic record
#   annotations.pod_name       — pod that triggered the alert
#   annotations.container_name — container within the pod
#   annotations.namespace      — namespace of the affected workload
#   annotations.summary        — included in the RCA context sent to the LLM
#   annotations.diagnostic_hint — structured signal passed to the LLM
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: causa-rca-alerts
  namespace: PLACEHOLDER_RULE_NAMESPACE
  labels:
    # prometheus: k8s   — picked up by the platform Prometheus Operator on OpenShift
    # and by kube-prometheus-stack on Kind when ruleSelector: {} is set.
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: causa-rca.rules
      # Evaluate every 30s — aligned with the Causa Backend cooldown period
      # so a re-fired alert is not sent before the previous RCA has completed.
      interval: 30s
      rules:

        # ── High Memory Usage ──────────────────────────────────────────────
        # Proactive alert: fires when a monitored container exceeds 80% of its
        # memory limit. Triggers RCA before the container is OOMKilled.
        - alert: causa-high-memory
          expr: |
            (
              sum by (namespace, pod, container) (
                container_memory_working_set_bytes{
                  container!="",
                  container!="POD"
                }
              )
              /
              sum by (namespace, pod, container) (
                kube_pod_container_resource_limits{
                  resource="memory",
                  container!="",
                  container!="POD"
                }
              )
            ) > 0.80
            and on(namespace, pod)
            kube_pod_labels{
              label_causa_ai_monitoring="true"
            }
          labels:
            severity: warning
          annotations:
            summary: "High memory usage in pod {{ $labels.pod }} ({{ $value | humanizePercentage }})"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.pod }}
              (namespace {{ $labels.namespace }}) is using
              {{ $value | humanizePercentage }} of its memory limit.
              RCA will be triggered if this persists.
            workload_name: "{{ $labels.container }}"
            pod_name: "{{ $labels.pod }}"
            container_name: "{{ $labels.container }}"
            namespace: "{{ $labels.namespace }}"
            diagnostic_hint: "high_memory_usage"

        # ── OOMKilled ──────────────────────────────────────────────────────
        # Reactive alert: fires when a monitored container was killed by the
        # kernel OOM reaper. Indicates the memory limit was exceeded.
        - alert: causa-oom-killed
          expr: |
            kube_pod_container_status_last_terminated_reason{
              reason="OOMKilled"
            } == 1
            and on(namespace, pod)
            kube_pod_labels{
              label_causa_ai_monitoring="true"
            }
          labels:
            severity: critical
          annotations:
            summary: "Container OOMKilled: {{ $labels.container }} in pod {{ $labels.pod }}"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.pod }}
              (namespace {{ $labels.namespace }}) exceeded its memory limit
              and was killed by the kernel OOM reaper.
            workload_name: "{{ $labels.container }}"
            pod_name: "{{ $labels.pod }}"
            container_name: "{{ $labels.container }}"
            namespace: "{{ $labels.namespace }}"
            diagnostic_hint: "oom_killed"

        # ── CrashLoopBackOff ───────────────────────────────────────────────
        # Fires when a monitored pod restarts more than twice in 10 minutes.
        - alert: causa-crash-loop
          expr: |
            increase(
              kube_pod_container_status_restarts_total[10m]
            ) > 2
            and on(namespace, pod)
            kube_pod_labels{
              label_causa_ai_monitoring="true"
            }
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "CrashLoopBackOff: pod {{ $labels.pod }} restarted {{ $value | humanize }} times in 10m"
            description: >-
              Pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) has
              restarted more than twice in the last 10 minutes.
            workload_name: "{{ $labels.container }}"
            pod_name: "{{ $labels.pod }}"
            container_name: "{{ $labels.container }}"
            namespace: "{{ $labels.namespace }}"
            diagnostic_hint: "crash_loop_back_off"
