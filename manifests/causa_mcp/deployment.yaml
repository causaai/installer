---
# Causa MCP Server — deployment
# Namespace placeholder: PLACEHOLDER_NAMESPACE  (replaced by installer at apply time)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: causa-mcp
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: causa-mcp
    app.kubernetes.io/component: causa-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: causa-mcp
  template:
    metadata:
      labels:
        app: causa-mcp
    spec:
      containers:
        - name: causa-mcp
          image: quay.io/causa-ai-hub/causa-mcp-server:0.0.1
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          env:
            # URL of the Causa Engine in the same namespace
            - name: CAUSA_ENGINE_URL
              value: "http://causa-backend.PLACEHOLDER_NAMESPACE.svc.cluster.local:8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: causa-mcp
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: causa-mcp
spec:
  # ClusterIP: reached from the host via `kubectl port-forward`,
  # not a NodePort host mapping.
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    app: causa-mcp
