---
# Async Profiler — deployment
# Namespace placeholder: PLACEHOLDER_NAMESPACE  (replaced by installer at apply time)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-profiler
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: async-profiler
    app.kubernetes.io/component: async-profiler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: async-profiler
  template:
    metadata:
      labels:
        app: async-profiler
    spec:
      serviceAccountName: async-profiler
      containers:
        - name: async-profiler
          image: quay.io/causaai/async-profiler:latest
          ports:
            - containerPort: 8082
              name: http
              protocol: TCP
          env:
            - name: TARGET_NAMESPACE
              value: "PLACEHOLDER_NAMESPACE"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: async-profiler
  namespace: PLACEHOLDER_NAMESPACE
---
apiVersion: v1
kind: Service
metadata:
  name: async-profiler
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: async-profiler
spec:
  type: NodePort
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: http
      nodePort: 30002
  selector:
    app: async-profiler
---
# RBAC: needs to watch/patch pods in the namespace to inject sidecars
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: async-profiler
  namespace: PLACEHOLDER_NAMESPACE
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: async-profiler
  namespace: PLACEHOLDER_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: async-profiler
subjects:
  - kind: ServiceAccount
    name: async-profiler
    namespace: PLACEHOLDER_NAMESPACE
