---
# Quarkus MCP Server — deployment
# Namespace placeholder: PLACEHOLDER_NAMESPACE  (replaced by installer at apply time)
#
# PROMETHEUS_URL  — required: URL of the Prometheus instance to fetch metrics from
# METRICS_APPS    — optional: direct app URL for local ring-buffer mode (no Prometheus)
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-metrics-config
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: mcp-metrics
data:
  PROMETHEUS_URL: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  # METRICS_APPS: "http://your-app-service.PLACEHOLDER_NAMESPACE.svc.cluster.local:8080"
  QUARKUS_MCP_SERVER_STDIO_ENABLED: "false"
  QUARKUS_HTTP_HOST_ENABLED: "true"
  QUARKUS_HTTP_HOST: "0.0.0.0"
  QUARKUS_HTTP_PORT: "8080"
  JAVA_OPTS_APPEND: "-Xmx256m -Xms128m -Dquarkus.http.host-enabled=true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-metrics
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: mcp-metrics
    app.kubernetes.io/component: quarkus-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-metrics
  template:
    metadata:
      labels:
        app: mcp-metrics
    spec:
      containers:
        - name: mcp-metrics
          image: quay.io/rh-ee-shesaxen/quarkus-mcp:bobathon
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mcp-metrics-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-metrics
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: mcp-metrics
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
      nodePort: 30004
  selector:
    app: mcp-metrics
