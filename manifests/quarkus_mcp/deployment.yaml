---
# Quarkus MCP Server — deployment
# Namespace placeholder: PLACEHOLDER_NAMESPACE  (replaced by installer at apply time)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-mcp
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: quarkus-mcp
    app.kubernetes.io/component: quarkus-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkus-mcp
  template:
    metadata:
      labels:
        app: quarkus-mcp
    spec:
      containers:
        - name: quarkus-mcp
          image: quay.io/causaai/quarkus-mcp:latest
          ports:
            - containerPort: 8084
              name: http
              protocol: TCP
          env:
            # URL of the Quarkus application being monitored
            # Override with the actual service name of your application
            - name: QUARKUS_APP_URL
              value: "http://quarkus-app.PLACEHOLDER_NAMESPACE.svc.cluster.local:8080"
            - name: MCP_SERVER_PORT
              value: "8084"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: quarkus-mcp
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: quarkus-mcp
spec:
  type: NodePort
  ports:
    - port: 8084
      targetPort: 8084
      protocol: TCP
      name: http
      nodePort: 30004
  selector:
    app: quarkus-mcp
